upstream frg_backend {
    server app:8000;
    keepalive 8;
}

# Rate limit key = TCP peer IP of the request to this nginx ($binary_remote_addr).
# When the browser hits the published FRONTEND_PORT directly, that is the visitor's IP.
# (If you put Cloudflare/another proxy in front later, enable real_ip below or all
# clients will share the proxy IP and hit one bucket together.)
#
# set_real_ip_from 10.0.0.0/8;
# set_real_ip_from 172.16.0.0/12;
# set_real_ip_from 192.168.0.0/16;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;

# Per-second: softens rapid refresh / parallel SPA calls.
limit_req_zone $binary_remote_addr zone=frg_api_rps:10m rate=20r/s;
# Per-minute: sustained cap (SPA can easily exceed old 60r/m on normal use).
limit_req_zone $binary_remote_addr zone=frg_api_rpm:10m rate=300r/m;

# Direct browser navigation to /api/* (Accept: text/html) → SPA rate-limit page.
map $http_accept $frg_rate_limit_html {
    default 0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    location /api/ {
        # Both limits apply; the stricter one triggers 429 first.
        limit_req zone=frg_api_rps burst=40 nodelay;
        limit_req zone=frg_api_rpm burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        error_page 429 = @frg_rate_limit;

        proxy_pass http://frg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location @frg_rate_limit {
        internal;
        if ($frg_rate_limit_html) {
            return 302 /too-many-requests;
        }
        default_type application/json;
        add_header Retry-After 30 always;
        return 429 '{"detail":"Too many requests"}';
    }

    location = /openapi.json {
        proxy_pass http://frg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|redoc) {
        proxy_pass http://frg_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
